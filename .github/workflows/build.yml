name: Build Vite App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Clean old output folder
        run: rm -rf abradabra || true

      - name: Build project
        run: npm run build

      - name: Verify output exists
        run: |
          if [ ! -d "abradabra" ]; then
            echo "Build failed: abradabra folder not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abradabra-build
          path: abradabra
